    <circle cx="914" cy="177" r="2.8"/><circle cx="927" cy="177" r="4"/><circle cx="940" cy="177" r="2.8"/>
    <circle cx="914" cy="190" r="2.8"/><circle cx="927" cy="190" r="2.8"/><circle cx="940" cy="190" r="2.8"/>
  </g>
  <g class="mono" font-size="12" fill="#d2e1e9" letter-spacing="1.6" text-anchor="middle">
    <text x="757" y="244">DATA</text>
    <text x="927" y="244">MODELS</text>
    <text x="1097" y="244">DECISIONS</text>
  </g>
  <g fill="#86e1cd">
